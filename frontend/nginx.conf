server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Docker internal DNS resolver (required for runtime hostname resolution)
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Proxy API calls to backend
    location /api/ {
        set $backend http://backend:8000;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        client_max_body_size 11m;
    }

    # Archivos adjuntos servidos por el backend
    location /uploads/ {
        set $backend http://backend:8000;
        rewrite ^/uploads/(.*) /uploads/$1 break;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # Assets con hash en el nombre → caché agresiva
    location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html nunca se cachea para que siempre cargue el bundle más reciente
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri /index.html;
    }

    # SPA fallback — all routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
