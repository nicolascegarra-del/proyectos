# PostgreSQL ya NO se gestiona en Docker: corre de forma nativa en el host
# (systemd en el VPS / instalador nativo en local). El backend lo alcanza vía
# host.docker.internal (ver extra_hosts). En producción, DATABASE_URL se define
# en las env vars de Coolify y sobreescribe el default local de abajo.
services:
  backend:
    build:
      context: ./backend
    # Sin container_name fijo: Coolify le pone un nombre con prefijo de proyecto,
    # para poder correr varios proyectos (v5 y v6) en el mismo host sin colisión.
    restart: unless-stopped
    # Necesario en Linux para que el contenedor resuelva host.docker.internal
    # hacia el Postgres nativo del host. En Docker Desktop ya resuelve solo.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://klyp:klyp_local_dev_2026@host.docker.internal:5432/klyp}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      FERNET_KEY: ${FERNET_KEY}
      FRONTEND_URL: ${FRONTEND_URL}
      APP_NAME: ${APP_NAME:-Klyp}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - uploads_data:/app/uploads
    deploy:
      resources:
        limits:
          memory: 1g

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    # Sin puerto publicado al host: en producción lo enruta el proxy de Coolify
    # por dominio. 'expose' indica el puerto interno (8080, nginx unprivileged) al
    # proxy. En local, el acceso por http://localhost:3000 lo da el override.
    expose:
      - "8080"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  uploads_data:
